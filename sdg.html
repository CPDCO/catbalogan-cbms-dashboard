<script>
  (function buildViz() {
    var baseUrl =
      "https://public.tableau.com/views/CatbaloganCitySDG/SDGIndicators";
    var isPhone =
      /Android|iPhone|iPod|IEMobile|Windows Phone/i.test(navigator.userAgent) ||
      window.innerWidth < 600;
    // Name the layout explicitly — left to itself Tableau sizes off the iframe
    // and can serve the phone layout to a desktop browser.
    var src = baseUrl
      + "?:embed=y"
      + "&:showVizHome=no"
      + "&:device=" + (isPhone ? "phone" : "desktop");
    var iframe = document.createElement("iframe");
    iframe.style.cssText =
      "width:100%; height:100%; max-width:1400px;" +
      "margin:0 auto; border:none; display:block;";
    iframe.setAttribute("title", "Catbalogan City SDG indicators");
    iframe.setAttribute("src", src);
    document.getElementById("vizContainer").appendChild(iframe);
  })();
</script>

<script src="assets/js/main.js"></script>
