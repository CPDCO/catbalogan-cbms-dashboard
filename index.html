<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catbalogan CBMS Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }
    .viz-container {
      flex-grow: 1;
      width: 100%;
      min-height: 0;
    }
    .viz-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .footer {
      text-align: left;
      padding: 8px 16px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="viz-container" id="vizContainer"></div>

  <div class="footer" id="visitor-count">Loading views...</div>

  <script>
    (function buildViz() {
      const baseUrl = "https://public.tableau.com/views/CatbaloganCityCBMS/Demography";

      const isPhone =
        window.innerWidth < 600 ||
        /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

      // Match the confirmed-working URL exactly, plus :embed=y for embedding
      const src = baseUrl
        + "?:embed=y"
        + "&:showVizHome=no"
        + (isPhone ? "&:device=phone" : "");

      const iframe = document.createElement("iframe");
      iframe.setAttribute("src", src);
      document.getElementById("vizContainer").appendChild(iframe);
    })();
  </script>

  <!-- Firebase visitor counter (unchanged) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF-eGFewM9QYBbvx2t7tTsV3VlTwhAqNs",
      authDomain: "cpdco-dashboard.firebaseapp.com",
      projectId: "cpdco-dashboard",
      storageBucket: "cpdco-dashboard.firebasestorage.app",
      messagingSenderId: "1071975859817",
      appId: "1:1071975859817:web:dd1ad31fa011938d8b04f8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "dashboard_stats", "cbms");
    const hasVisited = localStorage.getItem("cbms_visited");

    async function updateCounter() {
      if (!hasVisited) {
        await updateDoc(docRef, { views: increment(1) });
        localStorage.setItem("cbms_visited", "true");
      }
      const snapshot = await getDoc(docRef);
      const views = snapshot.data().views;
      document.getElementById("visitor-count").innerText =
        "Total Views: " + views.toLocaleString();
    }

    updateCounter();
  </script>

</body>
</html>
