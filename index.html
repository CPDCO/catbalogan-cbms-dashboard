<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catbalogan CBMS Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }
    #vizContainer {
      flex-grow: 1;
      width: 100%;
      min-height: 0;
    }
    .footer {
      text-align: left;
      padding: 8px 16px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div id="vizContainer"></div>

  <div class="footer" id="visitor-count">Loading views...</div>

  <!-- Tableau JS API v1 (required for Tableau Public embeds) -->
  <script type="text/javascript" src="https://public.tableau.com/javascripts/api/tableau-2.min.js"></script>
  <script type="text/javascript">
    function initViz() {
      const containerDiv = document.getElementById("vizContainer");
      const url = "https://public.tableau.com/views/CatbaloganCityCBMS/Demography";

      const isMobile = window.innerWidth < 800;

      const options = {
        hideTabs: true,
        hideToolbar: false,
        device: isMobile ? "phone" : "desktop",
        width: "100%",
        height: "100%",
        onFirstInteractive: function () {
          console.log("Viz loaded");
        }
      };

      new tableau.Viz(containerDiv, url, options);
    }

    window.addEventListener("load", initViz);
  </script>

  <!-- Firebase visitor counter -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDF-eGFewM9QYBbvx2t7tTsV3VlTwhAqNs",
      authDomain: "cpdco-dashboard.firebaseapp.com",
      projectId: "cpdco-dashboard",
      storageBucket: "cpdco-dashboard.firebasestorage.app",
      messagingSenderId: "1071975859817",
      appId: "1:1071975859817:web:dd1ad31fa011938d8b04f8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "dashboard_stats", "cbms");
    const hasVisited = localStorage.getItem("cbms_visited");

    async function updateCounter() {
      if (!hasVisited) {
        await updateDoc(docRef, { views: increment(1) });
        localStorage.setItem("cbms_visited", "true");
      }
      const snapshot = await getDoc(docRef);
      const views = snapshot.data().views;
      document.getElementById("visitor-count").innerText =
        "Total Views: " + views.toLocaleString();
    }

    updateCounter();
  </script>

</body>
</html>
